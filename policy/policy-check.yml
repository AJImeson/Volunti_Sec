# Policy as Code check — validates K3s manifests against the NIS2 policies
# in policy/*.rego. A 'deny' fails this job; 'warn' only prints.
#
# The manifests are Go/envsubst templates (`${IMAGE_TAG}`, `${PREFIX}`, host
# names) that deploy.py renders before `kubectl apply`. Conftest must see the
# SAME rendered YAML that actually reaches the cluster — otherwise it would
# validate `image: .../backend:${IMAGE_TAG}` literally and never check the real
# pinned tag. So we render first (envsubst), then test the rendered output.
#
# envsubst is used in allow-list mode (`envsubst '${VAR} ...'`) so it only
# substitutes the seven template variables and leaves everything else literal —
# notably the `$(MSSQL_SA_PASSWORD)` kubelet runtime reference.
#
# allow_failure: true keeps this report-only for now — the job shows up as an
# orange warning (!) instead of blocking, since the manifests still miss the
# NIS2 scope labels (nis2.eu/*). Remove that line once those gaps are closed to
# turn the policy into a hard gate.

policy-check:
  stage: security
  allow_failure: true
  image:
    name: openpolicyagent/conftest:latest
    entrypoint: [""] # image's default entrypoint is conftest itself; clear it so GitLab can run the script
  variables:
    PREFIX: ""
  script:
    - apk add --no-cache gettext # provides envsubst
    - export IMAGE_TAG="${CI_COMMIT_SHORT_SHA}"
    - mkdir -p rendered
    - |
      for f in $(find K3s -name '*.yaml'); do
        envsubst '${PREFIX} ${IMAGE_TAG} ${ASPNET_ENV} ${FRONTEND_HOST} ${BACKEND_HOST} ${ADMINER_HOST} ${BACKEND_URL}' \
          < "$f" > "rendered/$(echo "$f" | tr '/' '_')"
      done
    - conftest test rendered/ --policy policy/
