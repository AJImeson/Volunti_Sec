# Policy as Code check (GitHub Actions) — validates K3s manifests against the
# NIS2 policies in policy/*.rego. GitHub-native counterpart to the GitLab job
# in policy/policy-check.yml.
#
# continue-on-error: true makes this report-only for now — the run is marked
# with a warning instead of a red X, since the existing manifests don't yet
# pass the NIS2 checks. Remove that line to turn the policy into a hard gate.

name: policy-check

on:
  push:
    branches: [Volunti_Sec] # default branch of the Volunti_Sec repo
  pull_request:

jobs:
  conftest:
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: openpolicyagent/conftest:latest
    steps:
      - uses: actions/checkout@v4
      - name: Run NIS2 policy checks
        run: conftest test K3s/ --policy policy/
