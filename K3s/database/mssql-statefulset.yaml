# https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${PREFIX}mssql-sts
  namespace: doe25-group-13
  labels:
    app: ${PREFIX}mssql-sts
    nis2.eu/entity-classification: important
    nis2.eu/sector: digital-provider
    nis2.eu/owner: doe25-group-13
    nis2.eu/continuity-strategy: backup-restore
spec:
  selector:
    matchLabels:
      app: ${PREFIX}mssql-sts
  serviceName: "${PREFIX}mssql-sts"
  replicas: 1
  template:
    metadata:
      labels:
        app: ${PREFIX}mssql-sts
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: ${PREFIX}mssql-sts
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
        - containerPort: 1433
          name: mssql
        env:
          - name: ACCEPT_EULA
            value: "Y"
          - name: MSSQL_PID
            value: "Developer"
          - name: MSSQL_SA_PASSWORD
            valueFrom: 
              secretKeyRef:
                name: mssql-secret
                key: MSSQL_SA_PASSWORD
        volumeMounts:
        - name: mssql-data
          mountPath: /var/opt/mssql
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        # The mssql/server:2022 image already runs as the non-root 'mssql' user
        # (uid 10001) by default, so declaring it here matches current runtime
        # behaviour (no change to volume ownership). fsGroup is intentionally
        # omitted since /var/opt/mssql is already writable by 10001 today.
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
        # Health checks run a real 'SELECT 1' via sqlcmd (tools18 -> needs -C to
        # trust the self-signed cert). $MSSQL_SA_PASSWORD comes from the env/secret
        # and is expanded by the shell at runtime (envsubst leaves it untouched).
        # startupProbe absorbs the slow first start so liveness can't restart-loop
        # a booting SQL Server; no readinessProbe on purpose — on a single-replica
        # DB a flapping readiness drops the only endpoint and causes an outage.
        startupProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"'
          periodSeconds: 10
          failureThreshold: 30 # up to ~5 min for a fresh-PVC first start
        livenessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"'
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3 # ~60s sustained failure before restart
  volumeClaimTemplates:
  - metadata:
      name: mssql-data
    spec:
      storageClassName: local-path
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
---

