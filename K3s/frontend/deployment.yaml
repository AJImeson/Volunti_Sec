apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${PREFIX}volunti-frontend
  namespace: doe25-group-13
  labels:
    app: ${PREFIX}volunti-frontend
    nis2.eu/entity-classification: important
    nis2.eu/sector: digital-provider
    nis2.eu/owner: doe25-group-13
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ${PREFIX}volunti-frontend
  template:
    metadata:
      labels:
        app: ${PREFIX}volunti-frontend
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
      - name: ${PREFIX}volunti-frontend
        image: registry.chas-lab.dev/chas-challenge-2026/grupp-13/burgundy/frontend:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
          - name: BACKEND_URL
            value: "https://${PREFIX}volunti-api.cc.k3s.chas-lab.dev"
        volumeMounts:
          - name: nginx-config
            mountPath: /etc/nginx/templates/default.conf.template
            subPath: default.conf.template
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 20
        # nginxinc/nginx-unprivileged runs as uid 101 and listens on 8080 (no
        # privileged port), so the frontend can run fully non-root.
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          allowPrivilegeEscalation: false
      volumes:
        - name: nginx-config
          configMap:
            name: ${PREFIX}frontend-nginx-config


---
